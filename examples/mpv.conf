# Qt context-menu positioning workaround for Wayland sessions
# The menu uses Qt's X11/XWayland backend. Running mpv through x11vk puts both
# windows in the same coordinate system, allowing the menu to follow the mouse.
# This configuration works with both AMD and NVIDIA Vulkan drivers.

vo=gpu-next
gpu-api=vulkan
gpu-context=x11vk
target-colorspace-hint=auto
